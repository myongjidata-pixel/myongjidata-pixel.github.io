<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · Data Science Lab</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;display:grid;place-items:center;text-align:center;
       font-family:'Pretendard',-apple-system,sans-serif;
       background:linear-gradient(135deg,#0c1c36,#16356a 60%,#1d4f93);color:#fff;padding:30px}
  .big{font-size:clamp(4rem,16vw,9rem);font-weight:800;letter-spacing:-.03em;line-height:1}
  p{color:#cdd9ec;margin:14px 0 28px;font-size:1.05rem}
  a{display:inline-block;background:#fff;color:#13294B;font-weight:700;
    padding:13px 28px;border-radius:9px;transition:.2s}
  a:hover{background:#cfe0ff}
</style>
</head>
<body>
  <div>
    <div class="big">404</div>
    <p>페이지를 찾을 수 없습니다.</p>

  </div>
